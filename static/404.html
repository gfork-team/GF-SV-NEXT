<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>找不到頁面 - GFork Proxy</title>
		<style>
			/*
       * 静态托管的全局 404 页：不依赖任何外部资源、不依赖 JS。
       * 语言策略：非语言路径（如 /foo）一律回繁体中文页 —— 繁体是四个语言里
       * 覆盖用户最广的写法（简体用户同样能读），也是 defaultLang 之外最安全的选择。
       */
			:root {
				color-scheme: light dark;
				--bg: #fafafa;
				--surface: #fff;
				--text: #1f1f1f;
				--muted: #5f5f5f;
				--primary: #1d5fa8;
				--line: #e5e5e5;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0e1414;
					--surface: #161d1d;
					--text: #e6ebeb;
					--muted: #a3b0b0;
					--primary: #9ec3e8;
					--line: #2a3333;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: var(--bg);
				color: var(--text);
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					'Noto Sans TC',
					'PingFang TC',
					'Microsoft JhengHei',
					sans-serif;
				line-height: 1.7;
			}
			.card {
				width: 100%;
				max-width: 460px;
				padding: 40px 32px;
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 14px;
				box-shadow:
					0 1px 2px rgba(0, 0, 0, 0.03),
					0 8px 24px rgba(0, 0, 0, 0.04);
				text-align: center;
			}
			.code {
				margin: 0;
				font-size: 64px;
				font-weight: 300;
				letter-spacing: 2px;
				line-height: 1;
				color: var(--primary);
			}
			h1 {
				margin: 16px 0 8px;
				font-size: 20px;
				font-weight: 600;
			}
			p {
				margin: 0 0 24px;
				font-size: 14px;
				color: var(--muted);
			}
			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				justify-content: center;
			}
			a {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-height: 40px;
				padding: 0 18px;
				border-radius: 10px;
				font-size: 14px;
				font-weight: 500;
				text-decoration: none;
				border: 1px solid transparent;
			}
			a.primary {
				background: var(--primary);
				color: #fff;
			}
			a.outlined {
				border-color: var(--line);
				color: var(--text);
			}
			a:hover {
				filter: brightness(1.06);
			}
			a:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<p class="code">404</p>
			<h1>找不到頁面</h1>
			<p>您訪問的頁面不存在、已被移動，或連結有誤。</p>
			<div class="actions">
				<a class="primary" href="/zh-hant">回到首頁</a>
				<a class="outlined" href="/zh-hant/lookup">搜尋腳本</a>
				<a class="outlined" href="/zh-hant/help">說明</a>
			</div>
		</main>
	</body>
</html>
